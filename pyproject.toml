[project]
name = "csd-textal"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyter>=1.1.1",
    "openai>=2",
    "polars>=2.0.0",
    "pymupdf4llm<1",
    "pymupdf>=1.26,<2",
    "tqdm>=4.70.1,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset", "src/viz"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
ruff = ">=0.17.1,<0.18"
polars = ">=2.0.0,<3"
tqdm = ">=4.70.1,<5"
jsonargparse = ">=4.40.2,<5"
lxml = ">=6.1.3,<7"
pandoc = ">=3.12.1,<4"
matplotlib = ">=3.10,<4"
seaborn = ">=0.13,<0.14"
snakemake = ">=9,<10"
numpy = ">=2.2,<2.4"
pillow = "<13"
fastapi = ">=0.156.4,<0.157"
uvicorn = ">=0.54.0,<0.55"
plotly = ">=7.1.0,<8"
jinja2 = ">=3.1.6,<4"
rdkit = ">=2026.9.1,<2027"
py3dmol = ">=2.5.4,<3"

[tool.pixi.pypi-dependencies]
csd-textal = { path = ".", editable = true }
recess = { git = "https://github.com/alstonlo/recess.git" }

# MinerU and its GPU stack (PyTorch, vLLM) live in their own environment: `pixi run -e ocr ...`.
[tool.pixi.feature.ocr.dependencies]
poppler = "*"

[tool.pixi.feature.ocr.pypi-dependencies]
mineru = { version = ">=4.0.12,<5", extras = ["full"] }

# The CSD Python API pins older numpy, pandas and scipy, so it lives in its own environment too:
# `pixi run -e csd ...`. It needs a CCDC licence (see the README).
[tool.pixi.feature.csd.dependencies]
python-dotenv = ">=1,<2"
numpy = "<2.3"
pandas = "<2.3"
scipy = "<1.15"

[tool.pixi.feature.csd.pypi-dependencies]
# 3.8 fails to import under the conda Python: it cannot find `libpython3.so`.
csd-python-api = ">=3.7,<3.8"

[tool.pixi.feature.csd.pypi-options]
extra-index-urls = ["https://pip.ccdc.cam.ac.uk/"]

[tool.pixi.environments]
ocr = ["ocr"]
csd = ["csd"]

[tool.pixi.tasks]
web = "uvicorn viz.app:app --reload"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "E741",
    "E722",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
