[project]
name = "csd-textal"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pymupdf4llm<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset", "src/viz"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
ruff = ">=0.17.1,<0.18"
polars = ">=2.0.0,<3"
tqdm = ">=4.70.1,<5"
jsonargparse = ">=4.40.2,<5"
lxml = ">=6.1.3,<7"
pandoc = ">=3.12.1,<4"
matplotlib = ">=3.10,<4"
seaborn = ">=0.13,<0.14"
snakemake = ">=9,<10"
numpy = ">=2.3,<2.4"
pillow = "<13"

[tool.pixi.pypi-dependencies]
csd-textal = { path = ".", editable = true }
recess = { git = "https://github.com/alstonlo/recess.git" }

# MinerU and its GPU stack (PyTorch, vLLM) live in their own environment: `pixi run -e ocr ...`.
[tool.pixi.feature.ocr.dependencies]
poppler = "*"

[tool.pixi.feature.ocr.pypi-dependencies]
mineru = { version = ">=4.0.12,<5", extras = ["full"] }

[tool.pixi.environments]
ocr = ["ocr"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "E741",
    "E722",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
